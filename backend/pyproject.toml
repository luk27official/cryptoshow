[project]
name = "backend"
version = "1.1.0"
description = "Backend for CryptoShow"
requires-python = ">=3.12"
authors = [{ name = "Lukas Polak", email = "admin@lukaspolak.cz" }]

dependencies = [
    # FastAPI
    "fastapi[standard]",
    "requests",
    "prometheus-fastapi-instrumentator",
    "flower",

    # CryptoBench (Tiny), ESM-2
    "biopython==1.88",
    "transformers==4.57.6",
    "torch==2.13.0",

    # Clustering
    "scikit-learn",

    # Sequence + Structure functionality
    "biotite",

    # Trajectory generation
    "numpy",
    # Pinned to the currently validated release for the trajectory pipeline
    "MDAnalysis==2.10.0",
    "gemmi",
    "scipy",

    # Async tasks
    "celery",
    "redis"
]

